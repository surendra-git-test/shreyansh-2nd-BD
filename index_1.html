<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color-1: #e9edc9; 
            --bg-color-2: #fefae0; 
            --bg-color-3: #faedcd; 
            --text-main: #4a5240; 
            --frame-border: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-color-2) 0%, var(--bg-color-1) 50%, var(--bg-color-3) 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Playfair Display', serif;
            overflow: hidden; 
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            /* WhatsApp Status Size (9:16 aspect ratio) */

            width: 100vw;
            height: 97vh;
            height: 97dvh;
            max-width: 53.4vh; 
            border-radius: 15px;

            /*Maintains 9:16 ratio on wider screens*/

            background: linear-gradient(135deg, rgba(254, 250, 224, 0.8) 0%, rgba(233, 237, 201, 0.8) 100%);
            box-shadow:
                0 -25px 35px rgba(0, 0, 0, 0.12),
                0 25px 35px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        

        .text-container {
            position: absolute;
            top: 6%;
            width: 100%;
            text-align: center;
            z-index: 20;
            font-size:10px;
        }

        .greeting {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 10vw, 3.0rem);
            color: var(--text-main);
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.9);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpIn 1.5s ease-out 0.2s forwards;
            line-height: 1.1;
        }

        .sub-greeting {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: var(--text-main);
            margin-top: 0.5rem;
            font-style: italic;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUpIn 1.5s ease-out 0.8s forwards;
            text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeUpIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .collage-container {
            position: relative;
            width: 90%;
            height: 60%; /* Takes up middle section */
            margin-top: 25%; /* Push down below text */
            /* margin-bottom: 12%; */
        }

        .photo-wrapper {
            position: absolute;
            background-color: var(--frame-border);
            padding: 8px; /* The white border frame */
            border-radius: 12px;
            box-shadow: 
                0 15px 30px rgba(74, 82, 64, 0.2), 
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            opacity: 0;
            animation: fadeInScale 1s ease-out forwards;
            transition: transform 0.3s ease, z-index 0.3s;
        }

        .photo-wrapper:hover {
            transform: scale(1.05) !important;
            z-index: 30 !important;
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%; /* Focus on faces */
            border-radius: 6px;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .collage-container {
            position: relative;
            width: 92%;
            height: 68%; /* Increased height for the tall photo */
            margin-top: 28%; /* Pushed down safely below the text */
        }

        /* Left Tall Image */
        .pos-left {
            width: 55%;
            height: 85%; /* Makes this frame long and tall */
            top: 5%;
            left: 2%;
            z-index: 10;
            animation-delay: 1s;
            transform: rotate(-1deg);
        }
        .pos-left:hover { transform: rotate(0deg) scale(1.02) !important; z-index: 30 !important; }

        /* Top Right Image */
        .pos-right-top {
            width: 52%;
            aspect-ratio: 2.5 / 3; /* Square shape */
            top: -5%;
            right: 4%;
            z-index: 16;
            animation-delay: 1.4s;
            transform: rotate(3deg);
        }
        .pos-right-top:hover { transform: rotate(0deg) scale(1.05) !important; z-index: 30 !important; }

        /* Bottom Right Image */
        .pos-right-bottom {
            width: 52%;
            aspect-ratio: 2.5 / 3; /* Square shape */
            bottom: 2%;
            right: 4%;
            z-index: 25;
            animation-delay: 1.8s;
            transform: rotate(-2deg);
        }
        .pos-right-bottom:hover { transform: rotate(0deg) scale(1.05) !important; z-index: 30 !important; }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.6; }
            50% { transform: translateY(-50vh) scale(1.2); }
            80% { opacity: 0.4; }
            100% { transform: translateY(-100vh) scale(0.8); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Dynamic Particles Container -->
    <div id="particle-container"></div>

    <!-- Main Content Restricted to WhatsApp Status Size -->
    <div class="main-container">
        
        <div class="text-container">
            <h1 class="greeting">Happy 2nd Birthday! 🎉</h1>
            <p class="sub-greeting">My little prince, Shreyansh 👑💙</p>
        </div>
        
        <div class="collage-container">
            <!-- Left Tall Image -->
            <div class="photo-wrapper pos-left">
                <img src="ss1.jpeg" class="photo" alt="Nephew Photo 1">
            </div>

            <!-- Top Right Overlapping -->
            <div class="photo-wrapper pos-right-top">
                <img src="ss2.jpeg" class="photo" alt="Nephew Photo 2">
            </div>

            <!-- Bottom Right Overlapping -->
            <div class="photo-wrapper pos-right-bottom">
                <img src="ss3.jpeg" class="photo" alt="Nephew Photo 3">
            </div>
        </div>
        
    </div>

    <script>
        const particleContainer = document.getElementById('particle-container');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
            createParticle();
        }

        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 8 + 4; 
            const left = Math.random() * 100; 
            const duration = Math.random() * 10 + 10; 
            const delay = Math.random() * 15; 

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}vw`;
            particle.style.bottom = `-20px`; 
            
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;

            particleContainer.appendChild(particle);
        }
    </script>
</body>
</html>
